# Local development: the Astro dev server, served at https://gpc-website.puremint.xyz by
# Caddy in ~/infra (see ~/infra/README.md). `docker compose up -d` starts it.
services:
  app:
    build:
      # Debian, not Alpine: the Cloudflare adapter runs the dev server's
      # workerd, which needs glibc. The node_modules volume takes its owner
      # from this directory, so `node` can install into it.
      dockerfile_inline: |
        FROM node:22-slim
        RUN corepack enable
        RUN mkdir -p /app/node_modules && chown -R node:node /app
        USER node
        WORKDIR /app
    # yarn, per packageManager: package-lock.json lacks the Linux native bindings.
    # --force replaces the stale dev-server lock in .astro/ left by a restart.
    command: sh -c "yarn install --frozen-lockfile && yarn dev --force"
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    restart: unless-stopped
    volumes:
      - .:/app
      # Keep the container's Linux node_modules out of the host checkout.
      - node_modules:/app/node_modules
    # Caddy in ~/infra routes gpc-website.puremint.xyz to this port.
    ports:
      - 127.0.0.1:8007:8000
    networks:
      dev:
        aliases: [gpc-site]

volumes:
  node_modules:

networks:
  dev:
    external: true
